<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South China Express | Order Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --red:#c5161d;
      --red-dark:#971016;
      --gold:#f3c969;
      --black:#151515;
      --white:#fff;
      --green:#18864b;
      --blue:#225ea8;
      --orange:#c36a13;
      --gray-50:#fafafa;
      --gray-100:#f4f4f4;
      --gray-200:#e7e7e7;
      --gray-300:#d2d2d2;
      --gray-600:#666;
      --shadow:0 10px 28px rgba(0,0,0,.10);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#fffaf1,#f4efe7);
      color:var(--black);
      min-height:100vh;
    }

    button,input { font:inherit; }

    .topbar {
      position:sticky;
      top:0;
      z-index:50;
      background:var(--red);
      color:#fff;
      border-bottom:5px solid var(--gold);
      box-shadow:0 4px 18px rgba(0,0,0,.18);
    }

    .topbar-inner {
      max-width:1280px;
      margin:0 auto;
      padding:15px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
    }

    .brand h1 {
      margin:0;
      font-size:clamp(1.35rem,3vw,2rem);
      line-height:1;
    }

    .brand p {
      margin:5px 0 0;
      color:#ffe9ad;
      font-weight:700;
      font-size:.82rem;
    }

    .top-actions {
      display:flex;
      gap:8px;
      align-items:center;
    }

    .top-actions button {
      border:0;
      border-radius:10px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }

    .refresh-btn { background:#fff; color:var(--red); }
    .logout-btn { background:var(--black); color:#fff; }

    .wrap {
      max-width:1280px;
      margin:0 auto;
      padding:20px 18px 40px;
    }

    .login-card {
      max-width:480px;
      margin:45px auto;
      background:#fff;
      border-radius:20px;
      padding:24px;
      box-shadow:var(--shadow);
      border:1px solid #eadfce;
    }

    .login-card h2 { margin:0 0 16px; }
    .field { margin-bottom:12px; }

    label {
      display:block;
      font-weight:800;
      font-size:.88rem;
      margin-bottom:6px;
    }

    input {
      width:100%;
      padding:13px;
      border:1px solid var(--gray-300);
      border-radius:11px;
    }

    .login-button {
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px;
      background:var(--black);
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .dashboard { display:none; }

    .ordering-control {
      background:#fff;
      border:1px solid #eadfce;
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .ordering-control-copy strong {
      display:block;
      font-size:1.05rem;
      margin-bottom:4px;
    }

    .ordering-control-copy span {
      color:var(--gray-600);
      font-size:.88rem;
      font-weight:700;
    }

    .ordering-toggle {
      border:0;
      border-radius:12px;
      padding:13px 17px;
      min-width:170px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .ordering-toggle.open { background:var(--red); }
    .ordering-toggle.closed { background:var(--green); }
    .ordering-toggle:disabled { opacity:.55; cursor:not-allowed; }

    .summary {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }

    .summary-card {
      background:#fff;
      border-radius:15px;
      padding:15px;
      box-shadow:var(--shadow);
      border:1px solid #eadfce;
    }

    .summary-label {
      color:var(--gray-600);
      font-size:.82rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .summary-value {
      font-size:1.8rem;
      font-weight:900;
      margin-top:4px;
    }

    .filters {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .filter-btn {
      border:1px solid var(--gray-300);
      background:#fff;
      color:#333;
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .filter-btn.active {
      background:var(--black);
      color:#fff;
      border-color:var(--black);
    }

    .orders-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .order-card {
      background:#fff;
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid #eadfce;
    }

    .order-head {
      padding:14px 15px;
      color:#fff;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .order-card[data-status="NEW"] .order-head { background:var(--red); }
    .order-card[data-status="PREPARING"] .order-head { background:var(--orange); }
    .order-card[data-status="READY"] .order-head { background:var(--green); }
    .order-card[data-status="COMPLETED"] .order-head { background:#555; }
    .order-card[data-status="CANCELLED"] .order-head { background:#333; }

    .order-number {
      font-size:1.05rem;
      font-weight:900;
    }

    .order-time {
      font-size:.79rem;
      opacity:.92;
      margin-top:3px;
    }

    .status-badge {
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.35);
      border-radius:999px;
      padding:6px 9px;
      font-size:.74rem;
      font-weight:900;
      white-space:nowrap;
    }

    .order-body { padding:15px; }

    .customer {
      border-bottom:1px solid var(--gray-200);
      padding-bottom:11px;
      margin-bottom:11px;
    }

    .customer-name {
      font-size:1.1rem;
      font-weight:900;
    }

    .phone-link {
      display:inline-block;
      margin-top:5px;
      color:var(--blue);
      font-weight:800;
      text-decoration:none;
    }

    .items {
      display:grid;
      gap:9px;
      margin-bottom:12px;
    }

    .item {
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:9px;
      align-items:start;
    }

    .qty {
      font-weight:900;
      color:var(--red);
      min-width:25px;
    }

    .item-name { font-weight:800; }
    .item-option { color:var(--gray-600); font-size:.82rem; margin-top:2px; }
    .item-price { font-weight:900; white-space:nowrap; }

    .notes {
      background:#fff7df;
      border:1px solid #efdba3;
      padding:10px;
      border-radius:10px;
      margin:10px 0;
      line-height:1.4;
    }

    .notes strong {
      display:block;
      margin-bottom:3px;
      font-size:.82rem;
    }

    .order-footer {
      border-top:1px solid var(--gray-200);
      margin-top:12px;
      padding-top:12px;
    }

    .total-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      font-size:1.1rem;
      margin-bottom:4px;
    }

    .payment-line { margin-bottom:12px; }
    .payment-badge {
      display:inline-flex; align-items:center; gap:7px; padding:8px 11px;
      border-radius:999px; font-size:.8rem; line-height:1; font-weight:1000;
      letter-spacing:.02em; border:2px solid transparent;
    }
    .payment-badge.paid { background:#e8f7ee; color:#176b3a; border-color:#9dd8b5; }
    .payment-badge.unpaid { background:#fff0e8; color:#9b3414; border-color:#f0b195; }
    .payment-badge.other { background:#f1f3f5; color:#495057; border-color:#ced4da; }

    .actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .action-btn {
      border:0;
      border-radius:10px;
      padding:11px 9px;
      font-weight:900;
      cursor:pointer;
    }

    .primary-action { background:var(--black); color:#fff; }
    .secondary-action { background:var(--gray-100); color:#333; border:1px solid var(--gray-300); }

    .empty {
      grid-column:1/-1;
      text-align:center;
      padding:45px 20px;
      background:#fff;
      border:2px dashed var(--gray-300);
      border-radius:18px;
      color:var(--gray-600);
    }

    .message {
      display:none;
      margin-bottom:15px;
      padding:12px;
      border-radius:11px;
      font-weight:800;
    }

    .message.show { display:block; }
    .message.error { background:#fff0f0; color:#8b1d1d; border:1px solid #efc7c7; }
    .message.success { background:#e8f7ee; color:#16683b; border:1px solid #bce5ca; }

    .loading {
      text-align:center;
      padding:30px;
      color:var(--gray-600);
    }

    @media (max-width:1000px) {
      .orders-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }

    @media (max-width:650px) {
      .topbar-inner {
        padding:12px;
        align-items:flex-start;
      }

      .brand p { display:none; }

      .top-actions button {
        padding:9px 10px;
        font-size:.8rem;
      }

      .wrap { padding:14px 12px 30px; }
      .orders-grid { grid-template-columns:1fr; }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
      .summary-card { padding:12px; }
      .summary-value { font-size:1.45rem; }
      .filter-btn { padding:9px 11px; font-size:.83rem; }

      .ordering-control {
        align-items:stretch;
        flex-direction:column;
      }

      .ordering-toggle {
        width:100%;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>SOUTH CHINA EXPRESS</h1>
        <p>Live Order Dashboard</p>
      </div>

      <div id="topActions" class="top-actions" style="display:none;">
        <button class="refresh-btn" type="button" onclick="loadOrders()">Refresh</button>
        <button class="logout-btn" type="button" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="wrap">

    <section id="loginCard" class="login-card">
      <h2>Owner Sign In</h2>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>

      <button class="login-button" type="button" onclick="signIn()">Sign In</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="dashboard" class="dashboard">

      <div id="dashboardMessage" class="message"></div>

      <section class="ordering-control">
        <div class="ordering-control-copy">
          <strong id="orderingControlStatus">Checking ordering status…</strong>
          <span>Controls whether customers can place online orders.</span>
        </div>
        <button
          id="orderingToggle"
          class="ordering-toggle closed"
          type="button"
          onclick="toggleOrdering()"
          disabled
        >
          Checking…
        </button>
      </section>

      <section class="summary">
        <div class="summary-card">
          <div class="summary-label">New</div>
          <div id="newCount" class="summary-value">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Preparing</div>
          <div id="preparingCount" class="summary-value">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Ready</div>
          <div id="readyCount" class="summary-value">0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Today's Sales</div>
          <div id="todaySales" class="summary-value">$0</div>
        </div>
      </section>

      <div class="filters">
        <button class="filter-btn active" data-filter="ACTIVE" onclick="setFilter('ACTIVE', this)">Active</button>
        <button class="filter-btn" data-filter="NEW" onclick="setFilter('NEW', this)">New</button>
        <button class="filter-btn" data-filter="PREPARING" onclick="setFilter('PREPARING', this)">Preparing</button>
        <button class="filter-btn" data-filter="READY" onclick="setFilter('READY', this)">Ready</button>
        <button class="filter-btn" data-filter="COMPLETED" onclick="setFilter('COMPLETED', this)">Completed</button>
        <button class="filter-btn" data-filter="ALL" onclick="setFilter('ALL', this)">All</button>
      </div>

      <div id="ordersGrid" class="orders-grid">
        <div class="loading">Loading orders…</div>
      </div>
    </section>
  </main>

<script>
  const SUPABASE_URL = "https://xbomdoryfqyxiubtrffd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_iP4E_cTzYcqVz3JTmC99oA_dNCEJe8N";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let orders = [];
  let currentFilter = "ACTIVE";
  let ordersChannel = null;
  let settingsChannel = null;
  let orderingOpen = false;

  function money(value) {
    return "$" + Number(value || 0).toFixed(2);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showMessage(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "message show " + type;
  }

  function clearMessage(id) {
    const el = document.getElementById(id);
    el.textContent = "";
    el.className = "message";
  }

  async function signIn() {
    clearMessage("loginMessage");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("loginMessage", "Enter your email and password.", "error");
      return;
    }

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage("loginMessage", error.message, "error");
      return;
    }

    await refreshAuthUI();
  }

  async function signOut() {
    if (ordersChannel) {
      await db.removeChannel(ordersChannel);
      ordersChannel = null;
    }

    if (settingsChannel) {
      await db.removeChannel(settingsChannel);
      settingsChannel = null;
    }

    await db.auth.signOut();
    await refreshAuthUI();
  }

  async function refreshAuthUI() {
    const { data: { session } } = await db.auth.getSession();

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const topActions = document.getElementById("topActions");

    if (session) {
      loginCard.style.display = "none";
      dashboard.style.display = "block";
      topActions.style.display = "flex";
      await Promise.all([loadOrders(), loadOrderingStatus()]);
      subscribeToOrders();
      subscribeToOrderingStatus();
    } else {
      loginCard.style.display = "block";
      dashboard.style.display = "none";
      topActions.style.display = "none";
    }
  }

  async function loadOrderingStatus() {
    const status = document.getElementById("orderingControlStatus");
    const button = document.getElementById("orderingToggle");

    status.textContent = "Checking ordering status…";
    button.disabled = true;
    button.textContent = "Checking…";

    const { data, error } = await db
      .from("app_settings")
      .select("value")
      .eq("key", "ordering_open")
      .single();

    if (error) {
      console.error(error);
      status.textContent = "Could not load ordering status";
      button.textContent = "Unavailable";
      showMessage(
        "dashboardMessage",
        "Could not load the OPEN/CLOSED switch: " + error.message,
        "error"
      );
      return;
    }

    orderingOpen = Boolean(data?.value);
    renderOrderingControl();
  }

  function renderOrderingControl() {
    const status = document.getElementById("orderingControlStatus");
    const button = document.getElementById("orderingToggle");

    button.disabled = false;

    if (orderingOpen) {
      status.textContent = "🟢 ACCEPTING ONLINE ORDERS";
      button.textContent = "CLOSE ORDERING";
      button.className = "ordering-toggle open";
    } else {
      status.textContent = "🔴 ONLINE ORDERING CLOSED";
      button.textContent = "OPEN ORDERING";
      button.className = "ordering-toggle closed";
    }
  }

  async function toggleOrdering() {
    clearMessage("dashboardMessage");

    const button = document.getElementById("orderingToggle");
    button.disabled = true;

    const newValue = !orderingOpen;

    const { error } = await db
      .from("app_settings")
      .update({
        value: newValue,
        updated_at: new Date().toISOString()
      })
      .eq("key", "ordering_open");

    if (error) {
      button.disabled = false;
      showMessage(
        "dashboardMessage",
        "Could not change ordering status: " + error.message,
        "error"
      );
      return;
    }

    orderingOpen = newValue;
    renderOrderingControl();

    showMessage(
      "dashboardMessage",
      newValue
        ? "Online ordering is now OPEN."
        : "Online ordering is now CLOSED.",
      "success"
    );
  }

  function subscribeToOrderingStatus() {
    if (settingsChannel) return;

    settingsChannel = db
      .channel("south-china-express-dashboard-settings")
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "app_settings",
          filter: "key=eq.ordering_open"
        },
        payload => {
          orderingOpen = Boolean(payload.new?.value);
          renderOrderingControl();
        }
      )
      .subscribe();
  }

  async function loadOrders() {
    clearMessage("dashboardMessage");

    const grid = document.getElementById("ordersGrid");
    grid.innerHTML = '<div class="loading">Loading orders…</div>';

    const { data, error } = await db
      .from("orders")
      .select(`
        id,
        order_number,
        customer_name,
        customer_phone,
        notes,
        order_status,
        payment_method,
        payment_status,
        total,
        created_at,
        updated_at,
        order_items (
          id,
          item_name,
          item_option,
          unit_price,
          quantity,
          line_total
        )
      `)
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {
      console.error(error);
      showMessage(
        "dashboardMessage",
        "Could not load orders: " + error.message,
        "error"
      );
      grid.innerHTML = "";
      return;
    }

    orders = data || [];
    renderSummary();
    renderOrders();
  }

  function renderSummary() {
    const today = new Date();
    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const newCount = orders.filter(o => o.order_status === "NEW").length;
    const preparingCount = orders.filter(o => o.order_status === "PREPARING").length;
    const readyCount = orders.filter(o => o.order_status === "READY").length;

    const sales = orders
      .filter(o => {
        const created = new Date(o.created_at);
        return created >= start && o.order_status !== "CANCELLED";
      })
      .reduce((sum, o) => sum + Number(o.total || 0), 0);

    document.getElementById("newCount").textContent = newCount;
    document.getElementById("preparingCount").textContent = preparingCount;
    document.getElementById("readyCount").textContent = readyCount;
    document.getElementById("todaySales").textContent = money(sales);
  }

  function setFilter(filter, button) {
    currentFilter = filter;

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");
    renderOrders();
  }

  function filteredOrders() {
    if (currentFilter === "ALL") return orders;

    if (currentFilter === "ACTIVE") {
      return orders.filter(o =>
        ["NEW", "PREPARING", "READY"].includes(o.order_status)
      );
    }

    return orders.filter(o => o.order_status === currentFilter);
  }

  function nextStatus(status) {
    if (status === "NEW") return "PREPARING";
    if (status === "PREPARING") return "READY";
    if (status === "READY") return "COMPLETED";
    return null;
  }

  function nextButtonText(status) {
    if (status === "NEW") return "Start Preparing";
    if (status === "PREPARING") return "Mark Ready";
    if (status === "READY") return "Complete Order";
    return "";
  }

  function formatTime(value) {
    const d = new Date(value);
    return d.toLocaleString([], {
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    });
  }

  function paymentBadge(order) {
    const method = String(order.payment_method || "").toUpperCase();
    const status = String(order.payment_status || "").toUpperCase();

    if (status === "PAID") {
      return '<span class="payment-badge paid">✓ PAID ONLINE</span>';
    }
    if (method === "PAY AT PICKUP" && status === "UNPAID") {
      return '<span class="payment-badge unpaid">● PAY AT PICKUP — UNPAID</span>';
    }
    const text = `${method || "PAYMENT"} — ${status || "UNKNOWN"}`;
    return `<span class="payment-badge other">${escapeHtml(text)}</span>`;
  }

  function renderOrders() {
    const grid = document.getElementById("ordersGrid");
    const list = filteredOrders();

    if (!list.length) {
      grid.innerHTML = `
        <div class="empty">
          No orders in this view.
        </div>
      `;
      return;
    }

    grid.innerHTML = list.map(order => {
      const items = order.order_items || [];
      const next = nextStatus(order.order_status);

      const itemsHtml = items.map(item => `
        <div class="item">
          <div class="qty">${item.quantity}×</div>
          <div>
            <div class="item-name">${escapeHtml(item.item_name)}</div>
            ${item.item_option
              ? `<div class="item-option">${escapeHtml(item.item_option)}</div>`
              : ""
            }
          </div>
          <div class="item-price">${money(item.line_total)}</div>
        </div>
      `).join("");

      const primaryButton = next
        ? `<button class="action-btn primary-action" type="button"
             onclick="updateStatus('${order.id}','${next}')">
             ${nextButtonText(order.order_status)}
           </button>`
        : "";

      const cancelButton =
        !["COMPLETED","CANCELLED"].includes(order.order_status)
          ? `<button class="action-btn secondary-action" type="button"
               onclick="updateStatus('${order.id}','CANCELLED')">
               Cancel
             </button>`
          : "";

      const reopenButton =
        ["COMPLETED","CANCELLED"].includes(order.order_status)
          ? `<button class="action-btn secondary-action" type="button"
               onclick="updateStatus('${order.id}','NEW')">
               Reopen
             </button>`
          : "";

      return `
        <article class="order-card" data-status="${order.order_status}">
          <div class="order-head">
            <div>
              <div class="order-number">${escapeHtml(order.order_number)}</div>
              <div class="order-time">${formatTime(order.created_at)}</div>
            </div>
            <div class="status-badge">${escapeHtml(order.order_status)}</div>
          </div>

          <div class="order-body">
            <div class="customer">
              <div class="customer-name">${escapeHtml(order.customer_name)}</div>
              <a class="phone-link" href="tel:${escapeHtml(order.customer_phone)}">
                ${escapeHtml(order.customer_phone)}
              </a>
            </div>

            <div class="items">
              ${itemsHtml || '<div style="color:#777;">No item rows found.</div>'}
            </div>

            ${order.notes
              ? `<div class="notes"><strong>ORDER NOTES</strong>${escapeHtml(order.notes)}</div>`
              : ""
            }

            <div class="order-footer">
              <div class="total-row">
                <span>Total</span>
                <span>${money(order.total)}</span>
              </div>

              <div class="payment-line">
                ${paymentBadge(order)}
              </div>

              <div class="actions">
                ${primaryButton}
                ${cancelButton}
                ${reopenButton}
              </div>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  async function updateStatus(orderId, newStatus) {
    clearMessage("dashboardMessage");

    const order = orders.find(o => o.id === orderId);
    if (!order) return;

    const oldStatus = order.order_status;
    order.order_status = newStatus;
    renderSummary();
    renderOrders();

    const { error } = await db
      .from("orders")
      .update({ order_status: newStatus })
      .eq("id", orderId);

    if (error) {
      order.order_status = oldStatus;
      renderSummary();
      renderOrders();
      showMessage(
        "dashboardMessage",
        "Could not update order: " + error.message,
        "error"
      );
      return;
    }

    showMessage(
      "dashboardMessage",
      `${order.order_number} updated to ${newStatus}.`,
      "success"
    );
  }

  function subscribeToOrders() {
    if (ordersChannel) return;

    ordersChannel = db
      .channel("south-china-express-live-orders")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "orders"
        },
        () => {
          loadOrders();
        }
      )
      .subscribe();
  }

  db.auth.onAuthStateChange(() => {
    setTimeout(refreshAuthUI, 0);
  });

  refreshAuthUI();
</script>
</body>
</html>
