<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South China Express | Owner Controls</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --red:#c5161d;
      --red-dark:#971016;
      --gold:#f3c969;
      --black:#151515;
      --green:#18864b;
      --gray:#6d6d6d;
      --white:#fff;
      --shadow:0 12px 32px rgba(0,0,0,.13);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
      background:linear-gradient(180deg,#fffaf1,#f5f0e8);
      color:var(--black);
    }
    .top{
      background:var(--red);
      color:#fff;
      border-bottom:5px solid var(--gold);
      padding:22px 18px;
      text-align:center;
    }
    .top h1{margin:0;font-size:clamp(1.5rem,5vw,2.3rem)}
    .top p{margin:7px 0 0;color:#ffe8a9;font-weight:700}
    .wrap{max-width:520px;margin:28px auto;padding:0 16px}
    .card{
      background:#fff;
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:22px;
      border:1px solid #eadfce;
      margin-bottom:18px;
    }
    h2{margin:0 0 16px}
    label{display:block;font-weight:800;margin:0 0 6px}
    input{
      width:100%;
      padding:13px;
      border:1px solid #d5d5d5;
      border-radius:11px;
      margin-bottom:13px;
      font:inherit;
    }
    button{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px;
      font:inherit;
      font-weight:900;
      cursor:pointer;
    }
    .login-btn{background:var(--black);color:#fff}
    .logout-btn{background:#eee;color:#333;margin-top:11px}
    .control{display:none}
    .status{
      padding:16px;
      border-radius:14px;
      text-align:center;
      font-weight:900;
      margin-bottom:16px;
    }
    .status.open{background:#e8f7ee;color:#16683b;border:1px solid #bce5ca}
    .status.closed{background:#fff0f0;color:#8b1d1d;border:1px solid #efc7c7}
    .toggle-btn.open{background:var(--red);color:#fff}
    .toggle-btn.closed{background:var(--green);color:#fff}
    .message{
      display:none;
      margin-top:13px;
      padding:11px;
      border-radius:10px;
      line-height:1.4;
    }
    .message.show{display:block}
    .message.error{background:#fff0f0;color:#8b1d1d}
    .message.success{background:#e8f7ee;color:#16683b}
    .note{color:var(--gray);line-height:1.5;font-size:.9rem}
  </style>
</head>
<body>
  <header class="top">
    <h1>SOUTH CHINA EXPRESS</h1>
    <p>Owner Ordering Controls</p>
  </header>

  <main class="wrap">
    <section id="loginCard" class="card">
      <h2>Owner Sign In</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="login-btn" type="button" onclick="signIn()">Sign In</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="controlCard" class="card control">
      <h2>Online Ordering</h2>
      <div id="currentStatus" class="status closed">Checking status…</div>
      <button id="toggleButton" class="toggle-btn closed" type="button" onclick="toggleOrdering()">
        OPEN ORDERING
      </button>
      <button class="logout-btn" type="button" onclick="signOut()">Sign Out</button>
      <div id="controlMessage" class="message"></div>
    </section>

    <section class="card">
      <strong>How it works</strong>
      <p class="note">
        When you open ordering here, the public ordering page becomes active.
        When you close it, customers can still see the menu but cannot add items
        or submit orders.
      </p>
    </section>
  </main>

<script>
  // Use the SAME values as the customer ordering page.
  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const configured =
    !SUPABASE_URL.includes("YOUR_") &&
    !SUPABASE_ANON_KEY.includes("YOUR_");

  const db = configured
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  let orderingOpen = false;

  function showMessage(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "message show " + type;
  }

  function clearMessage(id) {
    const el = document.getElementById(id);
    el.textContent = "";
    el.className = "message";
  }

  async function signIn() {
    clearMessage("loginMessage");

    if (!configured) {
      showMessage(
        "loginMessage",
        "Add your Supabase Project URL and ANON key to this file first.",
        "error"
      );
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("loginMessage", "Enter your email and password.", "error");
      return;
    }

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage("loginMessage", error.message, "error");
      return;
    }

    await refreshAuthUI();
  }

  async function signOut() {
    if (!db) return;
    await db.auth.signOut();
    await refreshAuthUI();
  }

  async function refreshAuthUI() {
    if (!configured) return;

    const { data: { session } } = await db.auth.getSession();

    const loginCard = document.getElementById("loginCard");
    const controlCard = document.getElementById("controlCard");

    if (session) {
      loginCard.style.display = "none";
      controlCard.style.display = "block";
      await loadStatus();
    } else {
      loginCard.style.display = "block";
      controlCard.style.display = "none";
    }
  }

  async function loadStatus() {
    clearMessage("controlMessage");

    const { data, error } = await db
      .from("app_settings")
      .select("value")
      .eq("key", "ordering_open")
      .single();

    if (error) {
      showMessage("controlMessage", error.message, "error");
      return;
    }

    orderingOpen = Boolean(data?.value);
    renderStatus();
  }

  function renderStatus() {
    const status = document.getElementById("currentStatus");
    const button = document.getElementById("toggleButton");

    if (orderingOpen) {
      status.textContent = "🟢 ACCEPTING ONLINE ORDERS";
      status.className = "status open";
      button.textContent = "CLOSE ORDERING";
      button.className = "toggle-btn open";
    } else {
      status.textContent = "🔴 ONLINE ORDERING CLOSED";
      status.className = "status closed";
      button.textContent = "OPEN ORDERING";
      button.className = "toggle-btn closed";
    }
  }

  async function toggleOrdering() {
    clearMessage("controlMessage");

    const newValue = !orderingOpen;

    const { error } = await db
      .from("app_settings")
      .update({
        value: newValue,
        updated_at: new Date().toISOString()
      })
      .eq("key", "ordering_open");

    if (error) {
      showMessage("controlMessage", error.message, "error");
      return;
    }

    orderingOpen = newValue;
    renderStatus();

    showMessage(
      "controlMessage",
      newValue
        ? "Online ordering is now OPEN."
        : "Online ordering is now CLOSED.",
      "success"
    );
  }

  if (configured) {
    db.auth.onAuthStateChange(() => {
      setTimeout(refreshAuthUI, 0);
    });
    refreshAuthUI();
  } else {
    showMessage(
      "loginMessage",
      "Supabase connection details have not been added yet.",
      "error"
    );
  }
</script>
</body>
</html>
